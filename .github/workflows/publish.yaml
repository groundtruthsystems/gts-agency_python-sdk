name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify:
    needs: publish
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify build completion
        if: ${{ needs.publish.result == 'success' }}
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "✅ Published GTS Agency Python SDK to PyPI!\nTag: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify build failure
        if: ${{ needs.publish.result == 'failure' }}
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "❌ Failed to publish GTS Agency Python SDK to PyPI!\nTag: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nPlease check the workflow logs."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK